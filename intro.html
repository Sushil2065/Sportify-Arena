<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportify Arena</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='0' y='0' width='64' height='64' rx='16' fill='%231a1a1a'/%3E%3Cpath d='M46 16H30c-4.4 0-8 3.6-8 8s3.6 8 8 8h6c2.2 0 4 1.8 4 4s-1.8 4-4 4H18' stroke='%23ff6b00' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3Cpath d='M44 16L20 48' stroke='%23ff6b00' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='46' cy='16' r='3' fill='%23ff6b00'/%3E%3Ccircle cx='18' cy='48' r='3' fill='%23ff6b00'/%3E%3C/svg%3E" type="image/svg+xml">

    <style>
        :root {
            --primary-orange: #ff6b00;
            --accent-blue: #00bcd4;
            --dark-bg: #1a1a1a;
            --text-shadow-color: #8a3c00;
        }

        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        #containeer {
            /* Fallback color */
            background-color: var(--dark-bg);
            /* Added a dark gradient overlay so text remains readable */
            background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.5)), url("Sportify.jpg");
            background-size: cover;
            background-position: center;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            perspective: 1000px; /* Essential for 3D elements */
        }

        /* Glassmorphism Card Effect */
        #intro {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform: rotateX(5deg); /* Slight 3D tilt */
            transition: transform 0.3s ease;
            max-width: 800px;
            animation: slideUp 1s ease-out forwards;
            opacity: 0;
        }

        #intro:hover {
            transform: rotateX(0deg) scale(1.02);
            border-color: var(--primary-orange);
        }

        /* 3D Typography for Main Title */
        h1 {
            font-family: 'Russo One', sans-serif;
            font-size: 5rem;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 20px;
            line-height: 1;
            /* The 3D Layering Effect */
            text-shadow: 
                1px 1px 0px var(--primary-orange),
                2px 2px 0px var(--text-shadow-color),
                3px 3px 0px var(--text-shadow-color),
                4px 4px 0px var(--text-shadow-color),
                5px 5px 0px var(--text-shadow-color),
                6px 6px 0px var(--text-shadow-color),
                10px 10px 20px rgba(0,0,0,0.8);
        }

        h2 {
            color: #e0e0e0;
            font-weight: 400;
            font-size: 1.5rem;
            letter-spacing: 1px;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 3D Action Button */
        .btn-3d {
            display: inline-block;
            text-decoration: none;
            font-family: 'Russo One', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            color: white;
            background-color: var(--primary-orange);
            padding: 15px 40px;
            border-radius: 50px;
            transition: all 0.1s;
            position: relative;
            /* 3D Border Bottom */
            box-shadow: 0px 8px 0px var(--text-shadow-color), 0px 10px 20px rgba(0,0,0,0.4);
            top: 0;
        }

        .btn-3d:active {
            top: 8px; /* Moves down to simulate press */
            box-shadow: 0px 0px 0px var(--text-shadow-color), inset 0px 5px 10px rgba(0,0,0,0.2);
        }

        /* Animation Keyframes */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px) rotateX(10deg);
            }
            to {
                opacity: 1;
                transform: translateY(0) rotateX(5deg);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            h2 { font-size: 1.1rem; }
            #intro { padding: 2rem; width: 90%; }
        }
    </style>
</head>
<body>

    <div id="containeer">
        <div id="intro">
            <h1>Sportify Arena</h1>
            <h2>We fuel passion, performance, and the spirit to win.</h2>
            <a href="Webpage.php" class="btn-3d">Enter Arena</a>
        </div>
    </div>

</body>
</html>
